<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Mi Tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header th:replace="fragments/header :: header"></header>

    <!-- Main Content -->
    <main class="container my-4">
        <h1 th:text="${titulo}">Mi Tienda</h1>
        
        <div class="row">
            <div th:each="producto : ${productos}" class="col-md-4 mb-4">
                <div class="card">
                    <img th:src="${producto.imagenUrl}" class="card-img-top" 
                         th:alt="${producto.nombre}" style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${producto.nombre}">Producto</h5>
                        <p class="card-text" th:text="${producto.descripcion}">Descripción</p>
                        <p class="card-text">
                            <strong th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">$0.00</strong>
                        </p>
                        <a th:href="@{/producto/} + ${producto.id}" class="btn btn-primary">Ver Detalles</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
