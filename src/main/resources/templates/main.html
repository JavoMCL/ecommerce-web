<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">TecByte</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" href="/css/app.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>

<body>

<div class="container mt-4">

    <!-- Navbar -->
    <div th:replace="~{navbar :: navbar}"></div>

    <!-- Welcome title -->
    <h2 class="mt-4 mb-3">Latest added products</h2>

    <!-- Products container -->
    <div class="row" id="productosContainer">

        <!-- If there are no products -->
        <div class="col-12 text-muted" th:if="${#lists.isEmpty(latestProducts)}">
            No products have been registered yet.
        </div>

        <!-- Dynamic cards -->
        <div class="col-md-4 mb-4 producto-card"
             th:each="p : ${latestProducts}"
             th:data-price="${p.price}">

            <div class="card h-100 shadow-sm producto" style="display:none;">

                <!-- Imagen -->
                <a th:href="@{/product/{id}(id=${p.id})}" class="text-decoration-none">
                    <img th:src="@{'/api/products/' + ${p.id} + '/image'}"
                         class="card-img-top"
                         style="height:180px; object-fit:cover;"
                         th:alt="${p.name}">
                </a>

                <div class="card-body d-flex flex-column">
                    <a th:href="@{/product/{id}(id=${p.id})}" class="text-decoration-none text-dark">
                        <h5 class="card-title" th:text="${p.name}"></h5>
                    </a>

                    <p class="small" th:text="${p.description}"></p>

                    <h6 class="text-success fw-bold" th:text="'PYG ' + ${p.price}"></h6>

                    <div class="mt-auto d-flex gap-2 flex-wrap">
                        <a th:href="@{/product/{id}(id=${p.id})}" class="btn btn-outline-secondary btn-sm">
                            View details
                        </a>

                        <form th:action="@{/cart/add/{id}(id=${p.id})}" method="post">
                            <input type="hidden" name="quantity" value="1">
                            <button type="submit" class="btn btn-outline-primary btn-sm btn-agregar">
                                <i class="bi bi-cart-plus"></i> Add to cart
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div th:replace="~{footer :: footer}"></div>

</div>

<!-- Bootstrap icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<script>
    $(document).ready(function () {

        // Entrance animation
        $('.producto').each(function (index) {
            $(this).delay(120 * index).fadeIn(400);
        });

        // Smooth hover
        $('.producto').hover(
            function () { $(this).animate({marginTop: "-5px"}, 200); },
            function () { $(this).animate({marginTop: "0"}, 200); }
        );

        // Keep add-to-cart as a normal form submit so the request reaches the server

    });
</script>

</body>
</html>
