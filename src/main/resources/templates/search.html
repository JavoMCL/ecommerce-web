<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Results for: ' + ${query} + ' | TecByte'">Search</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 pt-5">
    <!-- Navbar -->
      <div th:replace="~{navbar :: navbar}"></div>

    <h3 th:text="'Results for: ' + ${query}"></h3>

    <div class="row mt-4">
        <div th:if="${#lists.isEmpty(results)}" class="text-muted">
            No products found.
        </div>

        <div class="col-md-4 mb-4" th:each="p : ${results}">
            <div class="card h-100 shadow-sm">

                <a th:href="@{/product/{id}(id=${p.id})}" class="text-decoration-none">
                    <img th:src="@{'/api/products/' + ${p.id} + '/image'}"
                         class="card-img-top"
                         style="height:200px; object-fit:cover;"
                         th:alt="${p.name}">
                </a>

                <div class="card-body d-flex flex-column">
                    <a th:href="@{/product/{id}(id=${p.id})}" class="text-decoration-none text-dark">
                        <h5 th:text="${p.name}"></h5>
                    </a>

                    <p th:text="${p.description}" class="small"></p>
                    <h6 class="text-success" th:text="'PYG ' + ${p.price}"></h6>

                    <div class="mt-auto d-flex gap-2 flex-wrap">
                        <a th:href="@{/product/{id}(id=${p.id})}" class="btn btn-outline-secondary btn-sm">
                            View details
                        </a>

                        <form th:action="@{/cart/add/{id}(id=${p.id})}" method="post">
                            <input type="hidden" name="quantity" value="1">
                            <button type="submit" class="btn btn-outline-primary btn-sm btn-agregar">
                                <i class="bi bi-cart-plus"></i> Add to cart
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
      <div th:replace="~{footer :: footer}"></div>
</div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
