<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error | TecByte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f7f7f7;
        }
        .error-card {
            max-width: 720px;
            margin: 8vh auto;
            border: 0;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }
        .error-code {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card error-card">
            <div class="card-body p-5">
                <div class="text-danger mb-3 error-code" th:text="${status}">500</div>
                <h1 class="h3 mb-3" th:text="${error}">Error</h1>
                <p class="text-muted mb-2" th:text="${message}">Ocurrió un error.</p>
                <p class="small text-secondary mb-4">Ruta: <span th:text="${path}">/</span></p>
                <p class="small text-secondary mb-4">Hora: <span th:text="${timestamp}">now</span></p>
                <div class="d-flex gap-2">
                    <a class="btn btn-primary" th:href="@{/}">Volver al inicio</a>
                    <a class="btn btn-outline-secondary" th:href="@{/login}">Ir al login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
