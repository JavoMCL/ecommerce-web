<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error | TecByte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            border: 0;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: white;
        }

        .error-code {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 800;
            line-height: 1;
            color: #ff6b6b;
        }

        .error-icon {
            font-size: clamp(3rem, 15vw, 6rem);
        }
    </style>
</head>
<body>
    <div class="container px-3 px-md-0">
        <div class="card error-card mx-auto" style="max-width: 600px;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-exclamation-triangle-fill error-icon text-danger"></i>
                </div>

                <div class="text-danger mb-3 error-code text-center" th:text="${status}">500</div>

                <h1 class="h3 mb-3 text-center" th:text="${error}">Error</h1>

                <p class="text-muted mb-2" th:text="${message}">An error occurred.</p>

                <p class="small text-secondary mb-3">
                    <strong>Path:</strong> <span th:text="${path}">/</span>
                </p>

                <p class="small text-secondary mb-4">
                    <strong>Time:</strong> <span th:text="${timestamp}">now</span>
                </p>

                <!-- Buttons: Stack on mobile, flex on desktop -->
                <div class="d-grid gap-2 d-md-flex">
                    <a class="btn btn-primary" th:href="@{/}">
                        <i class="bi bi-house-door"></i> Back to home
                    </a>
                    <a class="btn btn-outline-secondary" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right"></i> Go to login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
