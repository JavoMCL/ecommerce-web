<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrar Productos y Categorías</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" href="/css/app.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-4">
  <div th:replace="navbar :: navbar"></div>

  <h1 class="text-center mb-4">Panel de Administración</h1>

  <!-- ===================== CATEGORÍAS ===================== -->
  <div class="card shadow mb-5">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Categorías</h4>
    </div>

    <div class="card-body">
      <form id="formCategoria" class="row g-3">
        <input type="hidden" id="categoriaId">

        <div class="col-md-6">
          <input type="text" class="form-control" id="categoriaNombre" placeholder="Nombre de la categoría" required>
        </div>

        <div class="col-md-6">
          <button type="submit" class="btn btn-success">Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="resetCategoria()">Cancelar</button>
        </div>
      </form>

      <hr>

      <table class="table table-striped" id="tablaCategorias">
        <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Acciones</th>
        </tr>
        </thead>
        <tbody></tbody>
      </table>

    </div>
  </div>

  <!-- ===================== PRODUCTOS ===================== -->
  <div class="card shadow">
    <div class="card-header bg-success text-white">
      <h4 class="mb-0">Productos</h4>
    </div>

    <div class="card-body">

      <!-- FORMULARIO -->
      <form id="formProducto" class="row g-3" enctype="multipart/form-data">
        <input type="hidden" id="productoId">

        <div class="col-md-6">
          <input type="text" class="form-control" id="productoNombre" placeholder="Nombre del producto" required>
        </div>

        <div class="col-md-6">
          <input type="number" class="form-control" id="productoPrecio" placeholder="Precio" required>
        </div>

        <div class="col-md-12">
          <textarea class="form-control" id="productoDescripcion" placeholder="Descripción" required></textarea>
        </div>

        <div class="col-md-6">
          <select id="productoCategoria" class="form-select" required></select>
        </div>

        <div class="col-md-6">
          <input type="file" class="form-control" id="productoImagen" accept="image/*">
        </div>

        <div class="col-md-12">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="resetProducto()">Cancelar</button>
        </div>
      </form>

      <hr>

      <!-- ===================== TABS DE PRODUCTOS ===================== -->
      <ul class="nav nav-tabs" id="tabsProductosCategorias"></ul>

      <div class="tab-content mt-3" id="contenidoTabsProductos"></div>

    </div>
  </div>

  <div th:replace="footer :: footer"></div>
</div>



<!-- ===================== JAVASCRIPT ===================== -->
<script>
  const API_CAT = '/api/categorias';
  const API_PROD = '/api/productos';

  let listaCategorias = [];
  let listaProductos = [];

  /* ===== CATEGORÍAS ===== */
  async function cargarCategorias() {
    const res = await fetch(API_CAT);
    listaCategorias = await res.json();

    const tbody = document.querySelector('#tablaCategorias tbody');
    const select = document.querySelector('#productoCategoria');

    tbody.innerHTML = '';
    select.innerHTML = '<option value="">Seleccione categoría</option>';

    listaCategorias.forEach(c => {
      tbody.innerHTML += `
        <tr>
          <td>${c.id}</td>
          <td>${c.nombre}</td>
          <td>
            <button class="btn btn-warning btn-sm" onclick='editarCategoria(${JSON.stringify(c)})'>Editar</button>
            <button class="btn btn-danger btn-sm" onclick='eliminarCategoria(${c.id})'>Eliminar</button>
          </td>
        </tr>
      `;

      select.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
    });

    renderTabsProductosPorCategoria();
  }

  function editarCategoria(c) {
    categoriaId.value = c.id;
    categoriaNombre.value = c.nombre;
  }

  async function eliminarCategoria(id) {
    if (confirm("¿Eliminar categoría?")) {
      await fetch(`${API_CAT}/${id}`, { method: 'DELETE' });
      cargarCategorias();
      cargarProductos();
    }
  }

  function resetCategoria() {
    categoriaId.value = '';
    categoriaNombre.value = '';
  }

  /* ===== PRODUCTOS ===== */
  async function cargarProductos() {
    const res = await fetch(API_PROD);
    listaProductos = await res.json();

    renderTabsProductosPorCategoria();
  }

  document.querySelector('#formProducto').addEventListener('submit', async e => {
    e.preventDefault();

    const formData = new FormData();
    formData.append("nombre", productoNombre.value);
    formData.append("descripcion", productoDescripcion.value);
    formData.append("precio", productoPrecio.value);
    formData.append("categoria_id", productoCategoria.value);

    const img = productoImagen.files[0];
    if (img) formData.append("imagen", img);

    const id = productoId.value;
    const metodo = id ? 'PUT' : 'POST';
    const url = id ? `${API_PROD}/${id}` : API_PROD;

    await fetch(url, {
      method: metodo,
      body: formData
    });

    resetProducto();
    cargarProductos();
  });

  function editarProducto(p) {
    productoId.value = p.id;
    productoNombre.value = p.nombre;
    productoDescripcion.value = p.descripcion;
    productoPrecio.value = p.precio;
    productoCategoria.value = p.categoria ? p.categoria.id : "";
  }

  async function eliminarProducto(id) {
    if (confirm("¿Eliminar producto?")) {
      await fetch(`${API_PROD}/${id}`, { method: 'DELETE' });
      cargarProductos();
    }
  }

  function resetProducto() {
    formProducto.reset();
    productoId.value = "";
  }


  /* ========================================================= */
  /* TABS DE PRODUCTOS POR CATEGORIA */
  /* ========================================================= */
  function renderTabsProductosPorCategoria() {
    const tabs = document.getElementById("tabsProductosCategorias");
    const content = document.getElementById("contenidoTabsProductos");

    if (!listaCategorias.length) return;

    tabs.innerHTML = "";
    content.innerHTML = "";

    listaCategorias.forEach((cat, index) => {
      const active = index === 0 ? "active" : "";

      tabs.innerHTML += `
        <li class="nav-item" role="presentation">
          <button class="nav-link ${active}"
            data-bs-toggle="tab"
            data-bs-target="#tabCat${cat.id}">
            ${cat.nombre}
          </button>
        </li>
      `;

      content.innerHTML += `
        <div class="tab-pane fade ${active ? "show active" : ""}" id="tabCat${cat.id}">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Imagen</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbodyCat${cat.id}"></tbody>
          </table>
        </div>
      `;
    });

    llenarProductosEnTabs();
  }

  function llenarProductosEnTabs() {
    listaCategorias.forEach(cat => {
      const tbody = document.getElementById("tbodyCat" + cat.id);
      if (!tbody) return;

      tbody.innerHTML = "";

      const filtrados = listaProductos.filter(p => p.categoria && p.categoria.id === cat.id);

    filtrados.forEach(p => {
  tbody.innerHTML += `
    <tr>
      <td>${p.id}</td>
      <td>${p.nombre}</td>
      <td>$${p.precio}</td>
      <td>${p.categoria.nombre}</td>
      <td>
      <img src="${API_PROD}/${p.id}/imagen" width="60">
      </td>
      <td>
        <button class="btn btn-warning btn-sm" onclick='editarProducto(${JSON.stringify(p)})'>Editar</button>
        <button class="btn btn-danger btn-sm" onclick='eliminarProducto(${p.id})'>Eliminar</button>
      </td>
    </tr>
  `;
});

    });
  }

  cargarCategorias();
  cargarProductos();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
