<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products and Categories</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" href="/css/app.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid container-md py-4">
  <div th:replace="~{navbar :: navbar}"></div>

  <h1 class="text-center mb-5 mt-5 pt-3">Admin Panel</h1>

  <!-- ===================== CATEGORÍAS ===================== -->
  <div class="card shadow mb-5">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0"><i class="bi bi-tags"></i> Categories</h4>
    </div>

    <div class="card-body">
      <form id="formCategoria" class="row g-3">
        <input type="hidden" id="categoriaId">

        <div class="col-12 col-md-6">
          <label for="categoriaNombre" class="form-label">Category name</label>
          <input type="text" class="form-control" id="categoriaNombre" placeholder="Category name" required>
        </div>

        <div class="col-12 d-grid gap-2 d-md-flex">
          <button type="submit" class="btn btn-success">Save</button>
          <button type="button" class="btn btn-secondary" onclick="resetCategory()">Cancel</button>
        </div>
      </form>

      <hr>

      <div class="table-responsive">
        <table class="table table-sm table-striped align-middle" id="tablaCategorias">
          <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th class="text-center">Actions</th>
          </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- ===================== PRODUCTOS ===================== -->
  <div class="card shadow">
    <div class="card-header bg-success text-white">
      <h4 class="mb-0"><i class="bi bi-box"></i> Products</h4>
    </div>

    <div class="card-body">

      <!-- FORMULARIO -->
      <div id="productoAlert" class="alert alert-danger d-none mb-3" role="alert"></div>

      <form id="formProducto" class="row g-3 needs-validation" enctype="multipart/form-data" novalidate>
        <input type="hidden" id="productoId">

        <div class="col-12 col-md-6">
          <label for="productoNombre" class="form-label">Product name</label>
          <input type="text" class="form-control" id="productoNombre" placeholder="Product name" maxlength="100" required>
          <div class="invalid-feedback">The name is required and cannot exceed 100 characters.</div>
        </div>

        <div class="col-12 col-md-6">
          <label for="productoPrecio" class="form-label">Price</label>
          <input type="number" class="form-control" id="productoPrecio" placeholder="Price" min="0" step="0.01" required>
          <div class="invalid-feedback">The price is required.</div>
        </div>

        <div class="col-12">
          <label for="productoDescripcion" class="form-label">Description</label>
          <textarea class="form-control" id="productoDescripcion" placeholder="Description" rows="3" maxlength="500" required></textarea>
          <div class="invalid-feedback">The description is required and cannot exceed 500 characters.</div>
        </div>

        <div class="col-12 col-md-6">
          <label for="productoCategoria" class="form-label">Category</label>
          <select id="productoCategoria" class="form-select" required>
            <option value="">Select category</option>
          </select>
          <div class="invalid-feedback">You must select a category.</div>
        </div>

        <div class="col-12 col-md-6">
          <label for="productoStock" class="form-label">Stock</label>
          <input type="number" class="form-control" id="productoStock" placeholder="Stock" min="0" required>
          <div class="invalid-feedback">The stock is required and must be a positive number.</div>
        </div>

        <div class="col-12 col-md-6">
          <label for="productoImagen" class="form-label">Image</label>
          <input type="file" class="form-control" id="productoImagen" accept="image/*">
          <div id="productoImagenPreviewWrapper" class="mt-2 d-none">
            <img id="productoImagenPreview" src="" class="img-thumbnail" alt="Current product image" style="max-width: 160px;">
          </div>
        </div>

        <div class="col-12 d-grid gap-2 d-md-flex">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" onclick="resetProduct()">Cancel</button>
        </div>
      </form>

      <hr>

      <!-- ===================== TABS DE PRODUCTOS ===================== -->
      <div class="table-responsive">
        <ul class="nav nav-tabs" id="tabsProductosCategorias" role="tablist"></ul>
      </div>

      <div class="tab-content mt-3" id="contenidoTabsProductos"></div>

    </div>
  </div>

  <div th:replace="~{footer :: footer}"></div>
</div>



<!-- ===================== JAVASCRIPT ===================== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const API_CAT = '/api/categories';
  const API_PROD = '/api/products';

  let listaCategorias = [];
  let listaProductos = [];
  const productoAlert = document.getElementById('productoAlert');
  const productoImagenPreviewWrapper = document.getElementById('productoImagenPreviewWrapper');
  const productoImagenPreview = document.getElementById('productoImagenPreview');

  function showProductAlert(message) {
    productoAlert.textContent = message;
    productoAlert.classList.remove('d-none');
  }

  function hideProductAlert() {
    productoAlert.textContent = '';
    productoAlert.classList.add('d-none');
  }

  function showProductImagePreview(productId) {
    productoImagenPreview.src = `${API_PROD}/${productId}/image`;
    productoImagenPreviewWrapper.classList.remove('d-none');
  }

  function hideProductImagePreview() {
    productoImagenPreview.removeAttribute('src');
    productoImagenPreviewWrapper.classList.add('d-none');
  }

  /* ===== CATEGORIES ===== */
  async function loadCategories() {
    const res = await fetch(API_CAT);
    listaCategorias = await res.json();

    const tbody = document.querySelector('#tablaCategorias tbody');
    const select = document.querySelector('#productoCategoria');

    tbody.innerHTML = '';
    select.innerHTML = '<option value="">Select category</option>';

    listaCategorias.forEach(c => {
      tbody.innerHTML += `
        <tr>
          <td>${c.id}</td>
          <td>${c.name}</td>
          <td class="text-center">
            <button class="btn btn-warning btn-sm" onclick='editCategory(${JSON.stringify(c)})'>
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button class="btn btn-danger btn-sm" onclick='deleteCategory(${c.id})'>
              <i class="bi bi-trash"></i> Delete
            </button>
          </td>
        </tr>
      `;

      select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    });

    renderProductTabsByCategory();
  }

  function editCategory(c) {
    categoriaId.value = c.id;
    categoriaNombre.value = c.name;
  }

  async function deleteCategory(id) {
    if (confirm("Delete category?")) {
      await fetch(`${API_CAT}/${id}`, { method: 'DELETE' });
      loadCategories();
      loadProducts();
    }
  }

  function resetCategory() {
    categoriaId.value = '';
    categoriaNombre.value = '';
  }

  /* ===== PRODUCTS ===== */
  async function loadProducts() {
    const res = await fetch(API_PROD);
    listaProductos = await res.json();

    renderProductTabsByCategory();
  }

  // Handle category form submit (create / update)
  document.querySelector('#formCategoria').addEventListener('submit', async e => {
    e.preventDefault();

    const id = categoriaId.value;
    const name = categoriaNombre.value;

    if (!name || !name.trim()) {
      alert('Category name is required');
      return;
    }

    const metodo = id ? 'PUT' : 'POST';
    const url = id ? `${API_CAT}/${id}` : API_CAT;

    try {
      const res = await fetch(url, {
        method: metodo,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });

      if (!res.ok) {
        const text = await res.text();
        alert(`Error saving category: ${res.status} ${text}`);
        return;
      }

      resetCategory();
      await loadCategories();
    } catch (err) {
      console.error('Failed to save category', err);
      alert('Failed to save category. Check server logs.');
    }
  });

  document.querySelector('#formProducto').addEventListener('submit', async e => {
    e.preventDefault();

    hideProductAlert();
    formProducto.classList.add('was-validated');

    productoNombre.value = productoNombre.value.trim();
    productoDescripcion.value = productoDescripcion.value.trim();

    if (!formProducto.checkValidity()) {
      e.stopPropagation();
      formProducto.reportValidity();
      return;
    }

     const formData = new FormData();
     formData.append("name", productoNombre.value);
     formData.append("description", productoDescripcion.value);
     formData.append("price", productoPrecio.value);
     formData.append("stock", productoStock.value);
     formData.append("categoryId", productoCategoria.value);

    const img = productoImagen.files[0];
    if (img) formData.append("image", img);

    const id = productoId.value;
    const metodo = id ? 'PUT' : 'POST';
    const url = id ? `${API_PROD}/${id}` : API_PROD;

    try {
      const res = await fetch(url, {
        method: metodo,
        body: formData
      });

      if (!res.ok) {
        showProductAlert('Could not save the product. Check the required fields and length limits.');
        return;
      }

      resetProduct();
      await loadProducts();
    } catch (err) {
      console.error('Failed to save product', err);
      showProductAlert('Could not save the product. Check your connection or the server logs.');
    }
  });

   function editProduct(p) {
     productoId.value = p.id;
     productoNombre.value = p.name;
     productoDescripcion.value = p.description;
     productoPrecio.value = p.price;
     productoStock.value = p.stock ?? 0;
     productoCategoria.value = p.categoryId ?? "";
     productoImagen.value = '';

     if (p.image) {
       showProductImagePreview(p.id);
     } else {
       hideProductImagePreview();
     }
   }

  async function deleteProduct(id) {
    if (confirm("Delete product?")) {
      await fetch(`${API_PROD}/${id}`, { method: 'DELETE' });
      loadProducts();
    }
  }

   function resetProduct() {
     formProducto.reset();
     formProducto.classList.remove('was-validated');
     hideProductAlert();
     hideProductImagePreview();
     productoId.value = "";
     productoStock.value = "";
   }


  /* ========================================================= */
  /* PRODUCT TABS BY CATEGORY */
  /* ========================================================= */
  function renderProductTabsByCategory() {
    const tabs = document.getElementById("tabsProductosCategorias");
    const content = document.getElementById("contenidoTabsProductos");

    if (!listaCategorias.length) return;

    tabs.innerHTML = "";
    content.innerHTML = "";

    listaCategorias.forEach((cat, index) => {
      const active = index === 0 ? "active" : "";

      tabs.innerHTML += `
          <li class="nav-item" role="presentation">
          <button class="nav-link ${active}"
            data-bs-toggle="tab"
            data-bs-target="#tabCat${cat.id}" role="tab">
                ${cat.name}
          </button>
        </li>
      `;

      content.innerHTML += `
        <div class="tab-pane fade ${active ? "show active" : ""}" id="tabCat${cat.id}" role="tabpanel">
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle">
              <thead class="table-light">
                <tr>
                   <th>ID</th>
                   <th>Name</th>
                   <th>Price</th>
                   <th>Stock</th>
                   <th>Category</th>
                   <th class="text-center">Image</th>
                   <th class="text-center">Actions</th>
                 </tr>
              </thead>
              <tbody id="tbodyCat${cat.id}"></tbody>
            </table>
          </div>
        </div>
      `;
    });

    fillProductsInTabs();
  }

  function fillProductsInTabs() {
    listaCategorias.forEach(cat => {
      const tbody = document.getElementById("tbodyCat" + cat.id);
      if (!tbody) return;

      tbody.innerHTML = "";

      const filtered = listaProductos.filter(p => Number(p.categoryId) === Number(cat.id));

      filtered.forEach(p => {
        const categoryName = listaCategorias.find(c => Number(c.id) === Number(p.categoryId))?.name ?? '';

         tbody.innerHTML += `
           <tr>
             <td class="text-nowrap">${p.id}</td>
             <td>${p.name}</td>
             <td class="text-nowrap">PYG ${p.price}</td>
             <td class="text-nowrap"><strong>${p.stock}</strong></td>
             <td>${categoryName}</td>
             <td class="text-center">
               <img src="${API_PROD}/${p.id}/image" width="50" height="50" style="object-fit: cover;" alt="${p.name}">
             </td>
             <td class="text-center">
               <button class="btn btn-warning btn-sm" onclick='editProduct(${JSON.stringify(p)})' title="Edit">
                 <i class="bi bi-pencil"></i>
               </button>
               <button class="btn btn-danger btn-sm" onclick='deleteProduct(${p.id})' title="Delete">
                 <i class="bi bi-trash"></i>
               </button>
             </td>
           </tr>
         `;
      });

    });
  }

  loadCategories();
  loadProducts();

</script>


</body>
</html>
