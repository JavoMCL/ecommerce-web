<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrar Productos y Categorías</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
      <div th:replace="navbar :: navbar"></div>
    <h1 class="text-center mb-4">Panel de Administración</h1>

    <!-- ==================== CATEGORÍAS ==================== -->
    <div class="card mb-5 shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Categorías</h4>
      </div>
      <div class="card-body">
        <form id="formCategoria" class="row g-3">
          <div class="col-md-6">
            <input type="hidden" id="categoriaId">
            <input type="text" class="form-control" id="categoriaNombre" placeholder="Nombre de la categoría" required>
          </div>
          <div class="col-md-6">
            <button type="submit" class="btn btn-success">Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="resetCategoria()">Cancelar</button>
          </div>
        </form>

        <hr>

        <table class="table table-striped" id="tablaCategorias">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- ==================== PRODUCTOS ==================== -->
    <div class="card shadow">
      <div class="card-header bg-success text-white">
        <h4 class="mb-0">Productos</h4>
      </div>
      <div class="card-body">
        <form id="formProducto" class="row g-3" enctype="multipart/form-data">
          <input type="hidden" id="productoId">

          <div class="col-md-6">
            <input type="text" id="productoNombre" class="form-control" placeholder="Nombre del producto" required>
          </div>

          <div class="col-md-6">
            <input type="number" id="productoPrecio" class="form-control" placeholder="Precio" required>
          </div>

          <div class="col-md-12">
            <textarea id="productoDescripcion" class="form-control" placeholder="Descripción" required></textarea>
          </div>

          <div class="col-md-6">
            <select id="productoCategoria" class="form-select" required></select>
          </div>

          <div class="col-md-6">
            <input type="file" id="productoImagen" class="form-control" accept="image/*">
          </div>

          <div class="col-md-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" onclick="resetProducto()">Cancelar</button>
          </div>
        </form>

        <hr>

        <table class="table table-hover" id="tablaProductos">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Categoría</th>
              <th>Imagen</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
const API_CAT = '/api/categorias';
const API_PROD = '/api/productos';

// ==================== CATEGORÍAS ====================

async function cargarCategorias() {
    const res = await fetch(API_CAT);
    const categorias = await res.json();

    const tbody = document.querySelector('#tablaCategorias tbody');
    const select = document.querySelector('#productoCategoria');
    tbody.innerHTML = '';
    select.innerHTML = '<option value="">Seleccione categoría</option>';

    categorias.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td>${c.id}</td>
            <td>${c.nombre}</td>
            <td>
              <button class="btn btn-sm btn-warning" onclick='editarCategoria(${JSON.stringify(c)})'>Editar</button>
              <button class="btn btn-sm btn-danger" onclick='eliminarCategoria(${c.id})'>Eliminar</button>
            </td>
          </tr>
        `;
        select.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
    });
}

document.querySelector('#formCategoria').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('categoriaId').value;
    const nombre = document.getElementById('categoriaNombre').value;

    const metodo = id ? 'PUT' : 'POST';
    const url = id ? `${API_CAT}/${id}` : API_CAT;

    await fetch(url, {
        method: metodo,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, nombre })
    });

    resetCategoria();
    cargarCategorias();
});

function editarCategoria(c) {
    document.getElementById('categoriaId').value = c.id;
    document.getElementById('categoriaNombre').value = c.nombre;
}

async function eliminarCategoria(id) {
    if (confirm('¿Eliminar categoría?')) {
        await fetch(`${API_CAT}/${id}`, { method: 'DELETE' });
        cargarCategorias();
    }
}

function resetCategoria() {
    document.getElementById('categoriaId').value = '';
    document.getElementById('categoriaNombre').value = '';
}

// ==================== PRODUCTOS ====================

async function cargarProductos() {
    const res = await fetch(API_PROD);
    const productos = await res.json();
    const tbody = document.querySelector('#tablaProductos tbody');
    tbody.innerHTML = '';

    productos.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.id}</td>
            <td>${p.nombre}</td>
            <td>$${p.precio}</td>
            <td>${p.categoria?.nombre || '—'}</td>
            <td><img src="${p.imagen}" alt="" width="60"></td>
            <td>
              <button class="btn btn-sm btn-warning" onclick='editarProducto(${JSON.stringify(p)})'>Editar</button>
              <button class="btn btn-sm btn-danger" onclick='eliminarProducto(${p.id})'>Eliminar</button>
            </td>
          </tr>
        `;
    });
}

document.querySelector('#formProducto').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('productoId').value;
    const formData = new FormData();

    formData.append('nombre', document.getElementById('productoNombre').value);
    formData.append('descripcion', document.getElementById('productoDescripcion').value);
    formData.append('precio', document.getElementById('productoPrecio').value);
    formData.append('categoria_id', document.getElementById('productoCategoria').value);

    const img = document.getElementById('productoImagen').files[0];
    if (img) formData.append('imagen', img);

    if (id) formData.append('id', id);

    const metodo = id ? 'PUT' : 'POST';
    const url = id ? `${API_PROD}/${id}` : API_PROD;

    await fetch(url, { method: metodo, body: formData });

    resetProducto();
    cargarProductos();
});

function editarProducto(p) {
    document.getElementById('productoId').value = p.id;
    document.getElementById('productoNombre').value = p.nombre;
    document.getElementById('productoDescripcion').value = p.descripcion;
    document.getElementById('productoPrecio').value = p.precio;
    document.getElementById('productoCategoria').value = p.categoria?.id || '';
    document.getElementById('productoImagen').value = '';
}

async function eliminarProducto(id) {
    if (confirm('¿Eliminar producto?')) {
        await fetch(`${API_PROD}/${id}`, { method: 'DELETE' });
        cargarProductos();
    }
}

function resetProducto() {
    document.getElementById('formProducto').reset();
    document.getElementById('productoId').value = '';
    document.getElementById('productoImagen').value = '';
}

// Inicialización
cargarCategorias();
cargarProductos();
</script>


</body>
</html>
