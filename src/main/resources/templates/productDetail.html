<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' | TecByte'">Product detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" href="/css/app.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<div class="container-fluid container-md mt-4 pt-4 flex-grow-1">
    <div th:replace="~{navbar :: navbar}"></div>

    <div class="row g-4 mt-4">
        <!-- Image Column: Full width on mobile, half on desktop -->
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm">
                <div th:if="${product.imageBytes != null and product.imageBytes.length > 0}">
                    <img th:src="@{'/api/products/' + ${product.id} + '/image'}"
                         class="img-fluid rounded"
                         th:alt="${product.name}"
                         style="width:100%; max-height:500px; object-fit:cover;">
                </div>

                <div th:unless="${product.imageBytes != null and product.imageBytes.length > 0}"
                     class="d-flex align-items-center justify-content-center bg-light rounded"
                     style="min-height: 350px;">
                    <span class="text-muted">No image available</span>
                </div>
            </div>

            <!-- Action Buttons: Stack on mobile, row on tablet+ -->
            <div class="d-grid gap-2 d-md-flex mt-3">
                <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" class="w-100">
                    <input type="hidden" name="quantity" value="1">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-cart-plus"></i> Add to cart
                    </button>
                </form>

                <a th:href="@{/}" class="btn btn-outline-secondary w-100 w-md-auto">
                    <i class="bi bi-arrow-left"></i> Back to home
                </a>
            </div>
        </div>

        <!-- Product Info Column: Full width on mobile, half on desktop -->
        <div class="col-12 col-lg-6">
            <h1 class="mb-3" th:text="${product.name}"></h1>

            <p class="text-muted mb-2">
                Category:
                <strong th:text="${product.category != null ? product.category.name : 'No category'}"></strong>
            </p>

            <div class="mb-3">
                <span class="badge bg-success me-2" th:if="${product.available}">Available</span>
                <span class="badge bg-secondary me-2" th:unless="${product.available}">Not available</span>

                <span class="badge bg-info text-dark">
                    Stock: <span th:text="${product.stock}"></span>
                </span>
            </div>

            <div class="mb-4">
                <h5>Description</h5>
                <p class="lead" th:text="${product.description}"></p>
            </div>

            <h3 class="text-success fw-bold mb-4" th:text="'PYG ' + ${product.price}"></h3>

        </div>
    </div>
</div>

<div th:replace="~{footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
