<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${producto.nombre} + ' | TecByte'">Detalle del producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" href="/css/app.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<div class="container mt-4 pt-4 flex-grow-1">
    <div th:replace="navbar :: navbar"></div>

    <div class="row g-4 mt-4">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div th:if="${producto.imagenBytes != null and producto.imagenBytes.length > 0}">
                    <img th:src="@{'/api/productos/' + ${producto.id} + '/imagen'}"
                         class="img-fluid rounded"
                         th:alt="${producto.nombre}"
                         style="width:100%; max-height:500px; object-fit:cover;">
                </div>

                <div th:unless="${producto.imagenBytes != null and producto.imagenBytes.length > 0}"
                     class="d-flex align-items-center justify-content-center bg-light rounded"
                     style="min-height: 350px;">
                    <span class="text-muted">No hay imagen disponible</span>
                </div>

            </div>
            <div class="d-flex gap-2 flex-wrap mt-3">
                <form th:action="@{/carrito/agregar/{id}(id=${producto.id})}" method="post">
                    <input type="hidden" name="cantidad" value="1">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-cart-plus"></i> Agregar al carrito
                    </button>
                </form>

                <a th:href="@{/}" class="btn btn-outline-secondary">
                    Volver al inicio
                </a>
            </div>
        </div>

        <div class="col-lg-6">
            <h1 class="mb-3" th:text="${producto.nombre}"></h1>

            <p class="text-muted mb-2">
                Categoría:
                <strong th:text="${producto.categoria != null ? producto.categoria.nombre : 'Sin categoría'}"></strong>
            </p>

            <div class="mb-3">
                <span class="badge bg-success me-2" th:if="${producto.disponible}">Disponible</span>
                <span class="badge bg-secondary me-2" th:unless="${producto.disponible}">No disponible</span>

                <span class="badge bg-info text-dark">
                    Stock: <span th:text="${producto.stock}"></span>
                </span>
            </div>

            <div class="mb-4">
                <h5>Descripción</h5>
                <p class="lead" th:text="${producto.descripcion}"></p>
            </div>

            <h3 class="text-success fw-bold mb-4" th:text="'PYG ' + ${producto.precio}"></h3>

        </div>
    </div>
</div>

<div th:replace="footer :: footer"></div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
