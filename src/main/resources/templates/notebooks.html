<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
 <meta charset="UTF-8">
    <title th:text="${titulo}">NoteBooks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <!--Llamado del header y footer-->
    <div th:replace="navbar :: navbar"></div>

    <!--Contenido de la pagina-->
     <h1 class ="mb-4">Lista de notebooks</h1>
    <div class="row">
            <!-- Producto 1 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Notebook Gamer ASUS ROG</h5>
                        <p class="card-text">
                            • Procesador: Intel Core i7<br>
                            • RAM: 16GB DDR5<br>
                            • Almacenamiento: 1TB SSD<br>
                            • Pantalla: 15.6" FHD 144Hz
                        </p>
                        <p class="h4 text-primary">$1,299.99</p>
                        <button class="btn btn-primary">Agregar al Carrito</button>
                    </div>
                </div>
            </div>
            
                <!-- Producto 2 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">MacBook Air M2</h5>
                        <p class="card-text">
                            • Chip: Apple M2<br>
                            • RAM: 8GB Unified<br>
                            • Almacenamiento: 256GB SSD<br>
                            • Pantalla: 13.6" Liquid Retina
                        </p>
                        <p class="h4 text-primary">$300,45</p>
                        <button class="btn btn-primary">Agregar al Carrito</button>
                    </div>
                </div>
            </div>
</div>
</body>
</html>
