<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" href="/css/app.css" rel="stylesheet">
    <style>
        @media (max-width: 767px) {
            .cart-item {
                border: 1px solid #ddd;
                padding: 1rem;
                margin-bottom: 1rem;
                border-radius: 0.5rem;
            }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
<div class="container-fluid container-md mt-4 pt-5 flex-grow-1">
    <div th:replace="~{navbar :: navbar}"></div>

    <h2 class="mb-3 mt-3">My cart</h2>

    <div th:if="${#lists.isEmpty(items)}" class="alert alert-info mt-3">
        There are no products in your cart.
    </div>

    <div th:if="${!#lists.isEmpty(items)}" class="mt-4">
        <!-- Desktop view: Table -->
        <div class="table-responsive d-none d-md-block">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <td th:text="${item.product.name}"></td>
                    <td class="text-nowrap" th:text="${item.product.price} + ' PYG'"></td>
                    <td>
                        <form th:action="@{/cart/update}" method="post" class="d-flex gap-2 align-items-center">
                            <input type="hidden" name="itemId" th:value="${item.id}">
                            <input type="number" name="quantity" class="form-control form-control-sm" min="1"
                                   th:value="${item.amount}" style="max-width: 90px;">
                            <button class="btn btn-outline-primary btn-sm" type="submit">Update</button>
                        </form>
                    </td>
                    <td class="text-nowrap text-success fw-bold" th:text="${item.product.price * item.amount} + ' PYG'"></td>
                    <td>
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="itemId" th:value="${item.id}">
                            <button class="btn btn-danger btn-sm" type="submit">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Mobile view: Cards -->
        <div class="d-md-none">
            <div class="cart-item" th:each="item : ${items}">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h6 class="mb-0" th:text="${item.product.name}"></h6>
                    <form th:action="@{/cart/remove}" method="post" class="ms-2">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <button class="btn btn-sm btn-close" type="submit" title="Remove"></button>
                    </form>
                </div>
                <p class="text-muted mb-2">
                    Price: <strong th:text="${item.product.price} + ' PYG'"></strong>
                </p>
                <form th:action="@{/cart/update}" method="post" class="mb-2">
                    <input type="hidden" name="itemId" th:value="${item.id}">
                    <div class="input-group input-group-sm">
                        <label class="input-group-text">Qty:</label>
                        <input type="number" name="quantity" class="form-control" min="1"
                               th:value="${item.amount}">
                        <button class="btn btn-outline-primary" type="submit">Update</button>
                    </div>
                </form>
                <p class="text-success fw-bold mb-0">
                    Subtotal: <span th:text="${item.product.price * item.amount} + ' PYG'"></span>
                </p>
            </div>
        </div>

        <!-- Checkout Button: Full width on mobile, auto on desktop -->
        <div class="row mt-4">
            <div class="col-12 col-md-auto ms-md-auto">
                <form th:action="@{/cart/checkout}" method="post" class="w-100">
                    <button class="btn btn-success w-100">
                        <i class="bi bi-credit-card"></i> Checkout
                    </button>
                </form>
            </div>
        </div>

    </div>

    <div th:replace="~{footer :: footer}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
