<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4 pt-4">
    <div th:replace="~{navbar :: navbar}"></div>

    <h2 class="mb-3">My cart</h2>

    <div th:if="${#lists.isEmpty(items)}" class="alert alert-info mt-3">
        There are no products in your cart.
    </div>

    <div th:if="${!#lists.isEmpty(items)}" class="mt-4">
        <table class="table table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.product.name}"></td>
                <td th:text="${item.product.price} + ' PYG'"></td>
                <td>
                    <form th:action="@{/cart/update}" method="post" class="d-flex gap-2 align-items-center">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <input type="number" name="quantity" class="form-control form-control-sm" min="1"
                               th:value="${item.amount}" style="max-width: 90px;">
                        <button class="btn btn-outline-primary btn-sm" type="submit">Update</button>
                    </form>
                </td>
                <td th:text="${item.product.price * item.amount} + ' PYG'"></td>
                <td>
                    <form th:action="@{/cart/remove}" method="post">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <button class="btn btn-danger btn-sm" type="submit">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <form th:action="@{/cart/checkout}" method="post" class="mt-3">
            <button class="btn btn-success">Checkout</button>
        </form>

    </div>

    <div th:replace="~{footer :: footer}"></div>
</div>
</body>
</html>
