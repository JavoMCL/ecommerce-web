<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${category.name} + ' | TecByte'">Category</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" href="/css/app.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">
<div class="container-fluid container-md mt-4 pt-5 flex-grow-1">
  <div th:replace="~{navbar :: navbar}"></div>

  <h2 th:text="'Products in: ' + ${category.name}" class="mb-4 mt-3"></h2>

  <!-- Filter and Pagination Controls - Responsive -->
  <div class="row mb-4 g-3">
    <div class="col-12 col-sm-auto">
      <label for="filtroPrecio" class="form-label d-block d-sm-inline me-sm-2">Sort by price:</label>
      <select id="filtroPrecio" class="form-select form-select-sm" style="max-width: 150px;">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>
    </div>

    <div class="col-12 col-sm-auto ms-sm-auto">
      <div id="paginacion" class="d-flex gap-2 flex-wrap"></div>
    </div>
  </div>

  <!-- Products Container -->
  <div class="row g-3" id="productosContainer">
    <div class="col-12 text-muted" th:if="${#lists.isEmpty(products)}">
      No products in this category.
    </div>

    <!-- Products: 1 column mobile, 2 tablet, 3+ desktop -->
    <div class="col-12 col-sm-6 col-lg-4 producto-card" th:each="p : ${products}"
         th:data-price="${p.price}">
      <div class="card h-100 shadow-sm producto">

        <a th:href="@{/product/{id}(id=${p.id})}" class="text-decoration-none">
          <img th:src="@{'/api/products/' + ${p.id} + '/image'}"
               class="card-img-top"
               style="height:200px; object-fit:cover;"
               th:alt="${p.name}">
        </a>

        <div class="card-body d-flex flex-column">
          <a th:href="@{/product/{id}(id=${p.id})}" class="text-decoration-none text-dark">
            <h5 class="card-title" th:text="${p.name}"></h5>
          </a>

          <p th:text="${p.description}" class="small text-muted flex-grow-1"></p>
          <h6 class="text-success fw-bold mb-3" th:text="'PYG ' + ${p.price}"></h6>

          <div class="mt-auto d-grid gap-2">
            <a th:href="@{/product/{id}(id=${p.id})}" class="btn btn-outline-secondary btn-sm">
              View details
            </a>

            <form th:action="@{/cart/add/{id}(id=${p.id})}" method="post">
              <input type="hidden" name="quantity" value="1">
              <button type="submit" class="btn btn-outline-primary btn-sm btn-agregar w-100">
                <i class="bi bi-cart-plus"></i> Add to cart
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="~{footer :: footer}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  $(document).ready(function() {
    // Frontend pagination
    const productosPorPagina = 6;
    let productos = Array.from($('.producto-card'));
    let totalPaginas = Math.ceil(productos.length / productosPorPagina);

    function mostrarPagina(pagina) {
      // Hide all products only if not the first page
      if (pagina > 1) {
        $('.producto-card').hide();
      }

      // Show only products for this page
      let inicio = (pagina - 1) * productosPorPagina;
      let fin = inicio + productosPorPagina;
      productos.slice(inicio, fin).forEach((element, index) => {
        $(element).delay(100 * index).fadeIn(300);
      });

      generarBotones(pagina);
    }

    function generarBotones(paginaActual) {
      let paginacion = $('#paginacion');
      paginacion.empty();

      if (totalPaginas <= 1) return;

      for (let i = 1; i <= totalPaginas; i++) {
        let btn = $('<button>')
          .addClass('btn btn-outline-secondary btn-sm')
          .text(i)
          .toggleClass('active', i === paginaActual)
          .on('click', function() {
            mostrarPagina(i);
          });
        paginacion.append(btn);
      }
    }

    // Price filter
    $('#filtroPrecio').on('change', function() {
      let orden = $(this).val();
      productos = Array.from($('.producto-card')).sort(function(a, b) {
        let priceA = parseFloat($(a).data('price'));
        let priceB = parseFloat($(b).data('price'));
        return orden === 'asc' ? priceA - priceB : priceB - priceA;
      });

      // Re-insert sorted elements into DOM
      let container = $('#productosContainer');
      productos.forEach(element => {
        if ($(element).prev('.col-12.text-muted').length === 0) {
          container.append(element);
        }
      });

      mostrarPagina(1);
    });

    // Smooth hover effect on desktop only
    if (window.innerWidth >= 992) {
      $(document).on('mouseenter', '.producto', function() {
        $(this).animate({ marginTop: "-5px" }, 200);
      }).on('mouseleave', '.producto', function() {
        $(this).animate({ marginTop: "0" }, 200);
      });
    }

    // Show initial products
    mostrarPagina(1);
  });
</script>
</body>
</html>
