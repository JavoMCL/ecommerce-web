<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- FRAGMENTO DEL NAVBAR -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/}">TecByte</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">

            <!-- Barra de búsqueda -->
            <form class="d-flex me-auto" role="search">
                <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Buscar">
                <button class="btn btn-outline-success" type="submit">Buscar</button>
            </form>

            <!-- Opciones de navegación -->
            <ul class="navbar-nav">

                <!-- Login -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/login}">Iniciar Sesión</a>
                </li>

                <!-- Administrar -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">Administrar</a>
                </li>

                <!-- Dropdown de categorías dinámico -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Categorías
                    </a>

                    <ul class="dropdown-menu">
                        <li th:each="cat : ${categoriasNavbar}">
                            <a class="dropdown-item"
                               th:text="${cat.nombre}"
                               th:href="@{/categoria/{id}(id=${cat.id})}">
                            </a>
                        </li>
                    </ul>
                </li>

            </ul>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</nav>

</html>
