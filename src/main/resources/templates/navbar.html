<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- FRAGMENTO DEL NAVBAR -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/}">TecByte</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">

            <!-- Barra de búsqueda -->
            <form class="d-flex me-auto" th:action="@{/buscar}" method="get" role="search">
    <input class="form-control me-2" type="search" name="query" placeholder="Buscar productos..." aria-label="Buscar" required>
    <button class="btn btn-outline-success" type="submit">Buscar</button>
</form>

            <!-- Opciones de navegación -->
            <ul class="navbar-nav">

                <!-- Dropdown de categorías dinámico -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Categorías
                    </a>

                    <ul class="dropdown-menu">
                        <li th:each="cat : ${categoriasNavbar}">
                            <a class="dropdown-item"
                               th:text="${cat.nombre}"
                               th:href="@{/categoria/{id}(id=${cat.id})}">
                            </a>
                        </li>
                    </ul>
                </li>

                


                <!-- Administrar (solo usuarios admin, pendiente implementación) -->
                <li class="nav-item" th:if="${session.usuario != null}">
                    <!-- th:if="${session.usuario.admin}" -->
                    <a class="nav-link" th:href="@{/admin}">Administrar</a>
                </li>

                <!-- Carrito -->
                <li class="nav-item" th:if="${session.usuario != null}">
                    <a class="nav-link" th:href="@{/carrito/ver}">Carrito</a>
                </li>

                <!-- Mostrar login o cerrar sesión según sesión -->
                <li class="nav-item" th:if="${session.usuario == null}">
                    <a class="nav-link" th:href="@{/login}">Iniciar Sesión</a>
                </li>
                 <!-- Mostrar nombre del usuario si está logueado -->
                <li class="nav-item" th:if="${session.usuario != null}">
                    <a class="nav-link disabled" tabindex="-1" aria-disabled="true" th:text="${session.usuario.usuario}">Usuario</a>
                </li>
                <li class="nav-item" th:if="${session.usuario != null}">
                    <a class="nav-link" th:href="@{/logout}">Cerrar Sesión</a>
                </li>

            </ul>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</nav>

</html>
