<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
 xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">


<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center" th:href="@{/}" aria-label="Inicio">
            <i class="bi bi-house-door-fill fs-4"></i>
            <span class="ms-2 d-none d-md-inline">Inicio</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
            aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">


            <form class="d-flex me-auto" th:action="@{/buscar}" method="get" role="search">
                <input class="form-control me-2" type="search" name="query" placeholder="Buscar productos..."
                    aria-label="Buscar" required>
                <button class="btn btn-outline-success" type="submit">Buscar</button>
            </form>


            <ul class="navbar-nav">


                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <i class="bi bi-tags-fill"></i> Categorias
                    </a>

                    <ul class="dropdown-menu">
                        <li th:each="cat : ${categoriasNavbar}">
                            <a class="dropdown-item" th:href="@{/categoria/{id}(id=${cat.id})}">
                                <i class="bi bi-chevron-right"></i>
                                <span th:text="${cat.nombre}"></span>
                            </a>
                        </li>
                    </ul>
                </li>




                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}"><i class="bi bi-speedometer2"></i> Administrar</a>
                </li>


                <!-- Carrito -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/carrito/ver}"><i class="bi bi-cart3"></i> Carrito</a>
                </li>

                <!-- Mostrar login o cerrar sesion segun autenticacion -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}"><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesion</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link disabled" tabindex="-1" aria-disabled="true">
                        <i class="bi bi-person-circle"></i>
                        <span th:text="${#authentication.name}">Usuario</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="nav-logout-form">
                        <button type="submit" class="nav-link nav-logout-btn">
                            <i class="bi bi-box-arrow-right"></i> Cerrar Sesion
                        </button>
                    </form>
                </li>

                <li class="nav-item"><a class="nav-link" th:href="@{/servicios}"><i class="bi bi-tools"></i> Servicios</a>
                </li>

            </ul>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</nav>

</html>
