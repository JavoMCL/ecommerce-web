<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${categoria.nombre} + ' | TecByte'">Categoría</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" href="/css/app.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>

<body>
<div class="container mt-4">
  <div th:replace="navbar :: navbar"></div>

  <h2 th:text="'Productos en: ' + ${categoria.nombre}" class="mb-4"></h2>

  <!-- Controles de filtro y paginación -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <label for="filtroPrecio" class="form-label me-2">Ordenar por precio:</label>
      <select id="filtroPrecio" class="form-select d-inline-block w-auto">
        <option value="asc">Ascendente</option>
        <option value="desc">Descendente</option>
      </select>
    </div>

    <div id="paginacion" class="btn-group"></div>
  </div>

  <!-- Contenedor de productos -->
  <div class="row" id="productosContainer">
    <div class="col-12 text-muted" th:if="${#lists.isEmpty(productos)}">
      No hay productos en esta categoría.
    </div>

    <!-- Productos dinámicos -->
    <div class="col-md-4 mb-4 producto-card" th:each="p : ${productos}"
         th:data-precio="${p.precio}">
      <div class="card h-100 shadow-sm producto" style="display:none;">

        <a th:href="@{/producto/{id}(id=${p.id})}" class="text-decoration-none">
          <img th:src="@{'/api/productos/' + ${p.id} + '/imagen'}"
               class="card-img-top"
               style="height:180px; object-fit:cover;"
               th:alt="${p.nombre}">
        </a>

        <div class="card-body d-flex flex-column">
          <a th:href="@{/producto/{id}(id=${p.id})}" class="text-decoration-none text-dark">
            <h5 class="card-title" th:text="${p.nombre}"></h5>
          </a>

          <p th:text="${p.descripcion}" class="small"></p>
          <h6 class="text-success fw-bold" th:text="'PYG ' + ${p.precio}"></h6>

          <div class="mt-auto d-flex gap-2 flex-wrap">
            <a th:href="@{/producto/{id}(id=${p.id})}" class="btn btn-outline-secondary btn-sm">
              Ver detalle
            </a>

            <form th:action="@{/carrito/agregar/{id}(id=${p.id})}" method="post">
              <input type="hidden" name="cantidad" value="1">
              <button type="submit" class="btn btn-outline-primary btn-sm btn-agregar">
                <i class="bi bi-cart-plus"></i> Agregar al carrito
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="footer :: footer"></div>
</div>

<!-- Bootstrap icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<script>
  $(document).ready(function() {

    //  ANIMACIONES DE ENTRADA
    $('.producto').each(function(index) {
      $(this).delay(150 * index).fadeIn(400);
    });

    // EFECTO HOVER SUAVE EN TARJETAS
    $('.producto').hover(
            function() { $(this).animate({ marginTop: "-5px" }, 200); },
            function() { $(this).animate({ marginTop: "0" }, 200); }
    );

    // BOTÓN AGREGAR AL CARRITO
    $('.btn-agregar').on('click', function() {
      let btn = $(this);
      btn.prop('disabled', true).html('<i class="bi bi-cart-check"></i> Agregado');
      btn.closest('.card').animate({ opacity: 0.7 }, 200).animate({ opacity: 1 }, 200);
      setTimeout(() => {
        btn.prop('disabled', false).html('<i class="bi bi-cart-plus"></i> Agregar al carrito');
      }, 1500);
    });

    // === FILTRO POR PRECIO ===
    $('#filtroPrecio').on('change', function() {
      let orden = $(this).val();
      let productos = $('.producto-card').sort(function(a, b) {
        let precioA = parseFloat($(a).data('precio'));
        let precioB = parseFloat($(b).data('precio'));
        return orden === 'asc' ? precioA - precioB : precioB - precioA;
      });
      $('#productosContainer').html(productos);
      mostrarPagina(1);
    });

    // PAGINACIÓN FRONTEND
    const productosPorPagina = 6;
    let productos = $('.producto-card');
    let totalPaginas = Math.ceil(productos.length / productosPorPagina);

    function mostrarPagina(pagina) {
      productos.hide();
      let inicio = (pagina - 1) * productosPorPagina;
      let fin = inicio + productosPorPagina;
      productos.slice(inicio, fin).fadeIn(300);
      generarBotones(pagina);
    }

    function generarBotones(paginaActual) {
      let paginacion = $('#paginacion');
      paginacion.empty();
      for (let i = 1; i <= totalPaginas; i++) {
        let btn = $('<button>')
                .addClass('btn btn-outline-secondary btn-sm')
                .text(i)
                .toggleClass('active', i === paginaActual)
                .on('click', () => mostrarPagina(i));
        paginacion.append(btn);
      }
    }

    mostrarPagina(1);
  });
</script>
</body>
</html>
