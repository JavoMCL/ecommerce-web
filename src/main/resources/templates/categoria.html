<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${categoria.nombre}"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-4">
    <div th:replace="navbar :: navbar"></div>
    <h2 th:text="'Productos en: ' + ${categoria.nombre}" class="mb-4"></h2>

  <div class="row" th:if="${#lists.isEmpty(productos)}">
    <p class="text-muted">No hay productos en esta categoría.</p>
  </div>

  <div class="row" th:each="p : ${productos}">
    <div class="col-md-3 mb-4">
      <div class="card h-100 shadow-sm">

        <img th:src="${p.imagen}" class="card-img-top" style="height:200px; object-fit:cover">

        <div class="card-body">
          <h5 class="card-title" th:text="${p.nombre}"></h5>
          <p th:text="${p.descripcion}" class="small"></p>
          <h6 class="text-success" th:text="'$ ' + ${p.precio}"></h6>
        </div>

      </div>
    </div>
  </div>
    <!--Llamado del footer-->
    <div th:replace="footer :: footer"></div>
</div>

</body>
</html>
