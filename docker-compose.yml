services:
  ecommerce-web:
    build:
      context: .
      dockerfile: ecommerce_web/Dockerfile
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env
    environment:
      DB_URL: "${DB_URL}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      JAVA_OPTS: "${JAVA_OPTS}"
    restart: always
    depends_on:
      ecommerce_db:
        condition: service_healthy

  ecommerce_db:
    image: postgres:17
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10